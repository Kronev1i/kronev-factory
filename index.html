<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KRONEV Factory</title>
    <script src="https://telegram.org"></script>
    <style>
        :root {
            --bg-color: #17212b; /* Оригинальный темно-серый фон Telegram */
            --bg-secondary: #242f3d;
            --text-color: #f5f6f7;
            /* Матричный зеленый неон */
            --matrix-neon: #00ff41; 
            --matrix-dimmed: rgba(0, 255, 65, 0.12);
            --matrix-dark-btn: #003b11; /* Темно-зеленый неон для кнопок */
            --matrix-border: #008f11;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
            position: relative;
            /* Задаем глобальную 3D-перспективу для сцены */
            perspective: 800px;
        }

        /* 3D Ретро-сетка в стиле Матрицы (под наклоном камеры) */
        .retro-grid {
            position: absolute;
            top: 15%;
            left: 50%;
            width: 600px;
            height: 600px;
            /* Сдвигаем по центру и наклоняем по оси X, создавая эффект лежащей плоскости */
            transform: translateX(-50%) rotateX(65deg);
            background-image: 
                linear-gradient(var(--matrix-dimmed) 1.5px, transparent 1.5px),
                linear-gradient(90deg, var(--matrix-dimmed) 1.5px, transparent 1.5px);
            background-size: 40px 40px;
            z-index: 1;
            /* Плавное затухание (fade) сверху и снизу */
            mask-image: linear-gradient(to bottom, transparent, black 15%, black 75%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 15%, black 75%, transparent);
            /* Мягкое циклическое мерцание всей сетки */
            animation: matrixPulse 6s ease-in-out infinite;
        }

        .page {
            width: 100%;
            max-width: 400px;
            display: none;
            flex-direction: column;
            align-items: center;
            text-align: center;
            z-index: 2;
        }

        .page.active {
            display: flex;
        }

        /* Контейнер для имитации векторной анимации Telegram */
        .emoji-container {
            font-size: 88px;
            margin-bottom: 25px;
            display: inline-block;
            position: relative;
            z-index: 2;
            filter: drop-shadow(0 0 10px rgba(0, 255, 65, 0.2));
        }

        /* Анимация для Эмодзи в очках 😎 (Покачивание и блики) */
        .emoji-sunglasses {
            animation: tgSunglassesAnimate 3s ease-in-out infinite;
        }

        /* Анимация для Бумажного самолетика ✈️ (Полёт по восьмерке и покачивание крена) */
        .emoji-airplane {
            animation: tgAirplaneAnimate 3s ease-in-out infinite;
        }

        /* Всплывающий строго на 1 сантиметр (12px) текст */
        .slide-up-text {
            opacity: 0;
            animation: slideUpIn 0.5s cubic-bezier(0.1, 1, 0.1, 1) forwards;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin: 0 0 15px 0;
            letter-spacing: 0.5px;
        }

        p {
            font-size: 16px;
            color: #b2bec3;
            line-height: 1.5;
            margin: 0 0 35px 0;
        }

        /* Стили формы на втором слайде */
        .form-container {
            width: 100%;
            background-color: var(--bg-secondary);
            border-radius: 16px;
            padding: 22px;
            box-sizing: border-box;
            border: 1px solid rgba(0, 255, 65, 0.2);
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: var(--matrix-neon);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-align: left;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: 16px;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--matrix-neon);
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.25);
        }

        /* Кнопки в стиле Матрицы (Темно-зеленый неон с ярким бордером) */
        .btn {
            width: 100%;
            background-color: var(--matrix-dark-btn);
            color: var(--matrix-neon);
            border: 2px solid var(--matrix-border);
            border-radius: 12px;
            padding: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 20px rgba(0, 255, 65, 0.15);
            letter-spacing: 0.5px;
        }

        .btn:active {
            transform: scale(0.97);
            background-color: var(--matrix-border);
            color: #000000;
            box-shadow: 0 0 15px var(--matrix-neon);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* --- АНИМАЦИИ --- */

        /* Медленное дыхание сетки */
        @keyframes matrixPulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.6; }
        }

        /* Всплытие текста ровно за 1 см (12px) до основной точки */
        @keyframes slideUpIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Воссоздание логики ТГ-анимации для 😎 */
        @keyframes tgSunglassesAnimate {
            0%, 100% { transform: scale(1) translateY(0) rotate(0deg); }
            30% { transform: scale(1.05) translateY(-5px) rotate(-2deg); }
            45% { transform: scale(0.97) translateY(1px) rotate(2deg); }
            60% { transform: scale(1.02) translateY(-2px) rotate(-1deg); }
            75% { transform: scale(1) translateY(0) rotate(0deg); }
        }

        /* Воссоздание логики ТГ-анимации для ✈️ (летит и покачивается) */
        @keyframes tgAirplaneAnimate {
            0%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); }
            25% { transform: translate(4px, -6px) rotate(-4deg) scale(1.02); }
            50% { transform: translate(-2px, -2px) rotate(3deg) scale(0.98); }
            75% { transform: translate(3px, -4px) rotate(-2deg) scale(1.01); }
        }
    </style>
</head>
<body>

    <!-- Задний план: Наклоненная 3D сетка матрицы -->
    <div class="retro-grid"></div>

    <!-- ЭКРАН 1: ПРИВЕТСТВИЕ -->
    <div id="pageWelcome" class="page active">
        <div class="emoji-container emoji-sunglasses">😎</div>
        <div class="slide-up-text" id="welcomeText">
            <h1>Создай своего KRONEV</h1>
            <p>Привет! Здесь ты можешь создать своего личного KRONEV для автоматизации бизнеса. Начнём?</p>
        </div>
        <button class="btn" onclick="goToForm()">🚀 Начать</button>
    </div>

    <!-- ЭКРАН 2: ФОРМА СОЗДАНИЯ -->
    <div id="pageForm" class="page">
        <div class="emoji-container emoji-airplane">✈️</div>
        <div class="slide-up-text" id="formText">
            <h1>Параметры робота</h1>
            <p>Задайте базовые имя и юзернейм для автоматического развертывания.</p>
        </div>
        
        <div class="form-container">
            <div class="form-group">
                <label>🏷️ Название бота</label>
                <input type="text" id="botName" value="KRONEV Business Bot">
            </div>
            <div class="form-group">
                <label>🔗 Юзернейм бота (@)</label>
                <input type="text" id="botUsername" value="KronevTestBot">
            </div>
        </div>

        <button class="btn" id="submitBtn" onclick="submitData()">✨ Сгенерировать бота</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        function goToForm() {
            // Переключаем активные экраны
            document.getElementById('pageWelcome').classList.remove('active');
            const pageForm = document.getElementById('pageForm');
            pageForm.classList.add('active');
            
            // Перезапускаем анимацию всплытия текста строго для второго экрана
            const textElement = document.getElementById('formText');
            textElement.style.animation = 'none';
            textElement.offsetHeight; /* принудительный перерасчет стилей браузером */
            textElement.style.animation = null;
        }

        function submitData() {
            const name = document.getElementById('botName').value.trim();
            let username = document.getElementById('botUsername').value.trim();

            if (!name || !username) {
                tg.showAlert("⚠️ Пожалуйста, заполните все поля!");
                return;
            }

            if (username.startsWith('@')) {
                username = username.substring(1);
                }
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = "⏳ Отправка в матрицу...";
            const payload = JSON.stringify({
            bot_name: name,
            bot_username: username
            });
            // Безопасно передаем данные на Python бэкенд
            tg.sendData(payload);
            }
