<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KRONEV Factory</title>
    <script src="https://telegram.org"></script>
    <style>
        :root {
            --bg-color: #17212b; /* Оригинальный темно-серый фон Telegram */
            --bg-secondary: #242f3d;
            --text-color: #f5f6f7;
            --matrix-neon: #00ff41; /* Яркий салатовый неон */
            --matrix-dimmed: rgba(0, 255, 65, 0.12);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
            position: relative;
            perspective: 800px;
        }

        /* 3D Ретро-сетка (Оставляем без изменений, как ты просил) */
        .retro-grid {
            position: absolute;
            top: 15%;
            left: 50%;
            width: 600px;
            height: 600px;
            transform: translateX(-50%) rotateX(65deg);
            background-image: 
                linear-gradient(var(--matrix-dimmed) 1.5px, transparent 1.5px),
                linear-gradient(90deg, var(--matrix-dimmed) 1.5px, transparent 1.5px);
            background-size: 40px 40px;
            z-index: 1;
            mask-image: linear-gradient(to bottom, transparent, black 15%, black 75%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 15%, black 75%, transparent);
            animation: matrixPulse 6s ease-in-out infinite;
        }

        .page {
            width: 100%;
            max-width: 400px;
            display: none;
            flex-direction: column;
            align-items: center;
            text-align: center;
            z-index: 2;
        }

        .page.active {
            display: flex;
        }

        /* Контейнер для кастомных ТГ-эмодзи */
        .emoji-box {
            font-size: 84px;
            width: 100px;
            height: 100px;
            line-height: 100px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 2;
            filter: drop-shadow(0 0 15px rgba(0, 255, 65, 0.4));
            user-select: none;
        }

        /* Оригинальный ТГ-стайл для 😎 (Зацикленное покачивание и микро-мимика) */
        .tg-sunglasses {
            animation: tgCoolAnimate 3s ease-in-out infinite;
        }

        /* Оригинальный ТГ-стайл для ✈️ (Динамический полет со сменой крена) */
        .tg-plane {
            animation: tgPlaneAnimate 3s ease-in-out infinite;
        }

        /* Плавное всплытие текста на 1 сантиметр (12px) */
        .slide-up-text {
            opacity: 0;
            animation: slideUpIn 0.5s cubic-bezier(0.1, 1, 0.1, 1) forwards;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin: 0 0 15px 0;
            letter-spacing: 0.5px;
        }

        p {
            font-size: 16px;
            color: #b2bec3;
            line-height: 1.5;
            margin: 0 0 35px 0;
        }

        .form-container {
            width: 100%;
            background-color: var(--bg-secondary);
            border-radius: 16px;
            padding: 22px;
            box-sizing: border-box;
            border: 1px solid rgba(0, 255, 65, 0.2);
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: var(--matrix-neon);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: 16px;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--matrix-neon);
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.25);
        }

        /* 👑 ОБНОВЛЕННАЯ КНОПКА: Сплошной яркий неон, без бортиков, белый текст */
        .btn {
            width: 100%;
            background-color: var(--matrix-neon);
            color: #ffffff; /* Белый текст */
            border: none; /* Убрали бортик */
            border-radius: 12px;
            padding: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 20px rgba(0, 255, 65, 0.4); /* Плотное неоновое свечение */
            letter-spacing: 0.5px;
        }

        .btn:active {
            transform: scale(0.97);
            background-color: #00d436; /* Слегка темнеет при клике */
            box-shadow: 0 0 25px var(--matrix-neon);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* --- АНИМАЦИИ --- */
        @keyframes matrixPulse {
            0%, 100% { opacity: 0.25; }
            50% { opacity: 0.55; }
        }

        @keyframes slideUpIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Имитация Lottie-шейпов для 😎 (плавное зацикленное сжатие, расширение и наклон) */
        @keyframes tgCoolAnimate {
            0%, 100% { transform: scale(1) translateY(0) rotate(0deg); }
            25% { transform: scale(1.06) translateY(-6px) rotate(-3deg); }
            50% { transform: scale(0.95) translateY(2px) rotate(3deg); }
            75% { transform: scale(1.02) translateY(-2px) rotate(-1deg); }
        }

        /* Имитация Lottie-шейпов для бумажного самолетика ✈️ */
        @keyframes tgPlaneAnimate {
            0%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); }
            30% { transform: translate(6px, -8px) rotate(-6deg) scale(1.04); }
            65% { transform: translate(-3px, -2px) rotate(4deg) scale(0.96); }
        }
    </style>
</head>
<body>

    <!-- 3D Сетка на фоне -->
    <div class="retro-grid"></div>

    <!-- ЭКРАН 1: ПРИВЕТСТВИЕ -->
    <div id="pageWelcome" class="page active">
        <!-- Встроенный анимированный эмодзи в очках -->
        <div class="emoji-box tg-sunglasses">😎</div>
        <div class="slide-up-text" id="welcomeText">
            <h1>Создай своего KRONEV</h1>
            <p>Привет! Здесь ты можешь создать своего личного KRONEV для автоматизации бизнеса. Начнём?</p>
        </div>
        <button class="btn" onclick="goToForm()">🚀 Начать</button>
    </div>

    <!-- ЭКРАН 2: ВВОД ДАННЫХ -->
    <div id="pageForm" class="page">
        <!-- Встроенный анимированный самолётик -->
        <div class="emoji-box tg-plane">✈️</div>
        <div class="slide-up-text" id="formText">
            <h1>Параметры робота</h1>
            <p>Задайте базовые имя и юзернейм для автоматического развертывания.</p>
        </div>
        
        <div class="form-container">
            <div class="form-group">
                <label>🏷️ Название бота</label>
                <input type="text" id="botName" value="KRONEV Business Bot">
            </div>
            <div class="form-group">
                <label>🔗 Юзернейм бота (@)</label>
                <input type="text" id="botUsername" value="KronevTestBot">
            </div>
        </div>

        <button class="btn" id="submitBtn" onclick="submitData()">✨ Сгенерировать бота</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        function goToForm() {
            document.getElementById('pageWelcome').classList.remove('active');
            const pageForm = document.getElementById('pageForm');
            pageForm.classList.add('active');
            
            // Сброс и перезапуск анимации всплытия контента на втором экране
            const textElement = document.getElementById('formText');
            textElement.style.animation = 'none';
            textElement.offsetHeight; 
            textElement.style.animation = null;
        }

        def submitData() {
            const name = document.getElementById('botName').value.trim();
            let username = document.getElementById('botUsername').value.trim();

            if (!name || !username) {
                tg.showAlert("⚠️ Пожалуйста, заполните все поля!");
                return;
            }

            if (username.startsWith('@')) {
                username = username.substring(1);
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = "⏳ Отправка в матрицу...";

            const payload = JSON.stringify({
                bot_name: name,
                bot_username: username
            });

            tg.sendData(payload);
        }
    </script>
</body>
</html>
