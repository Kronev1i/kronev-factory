<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0,
                 maximum-scale=1.0, user-scalable=no"
    >

    <title>KRONEV Factory</title>

    <!-- Telegram Mini Apps SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Lottie -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>

    <style>
        :root {
            --bg-color: #17212b;
            --bg-secondary: #242f3d;
            --text-color: #f5f6f7;

            --matrix-neon: #00ff41;
            --matrix-dimmed: rgba(0, 255, 65, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            background-color: var(--bg-color);
            color: var(--text-color);

            padding: 20px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            min-height: 100vh;

            overflow: hidden;
            position: relative;

            perspective: 800px;
        }

        /* =========================
           3D MATRIX GRID
        ========================= */

        .retro-grid {
            position: absolute;

            top: 15%;
            left: 50%;

            width: 600px;
            height: 600px;

            transform:
                translateX(-50%)
                rotateX(65deg);

            background-image:
                linear-gradient(
                    var(--matrix-dimmed) 1.5px,
                    transparent 1.5px
                ),
                linear-gradient(
                    90deg,
                    var(--matrix-dimmed) 1.5px,
                    transparent 1.5px
                );

            background-size: 40px 40px;

            z-index: 1;

            mask-image:
                linear-gradient(
                    to bottom,
                    transparent,
                    black 15%,
                    black 75%,
                    transparent
                );

            -webkit-mask-image:
                linear-gradient(
                    to bottom,
                    transparent,
                    black 15%,
                    black 75%,
                    transparent
                );

            animation:
                matrixPulse 6s ease-in-out infinite;
        }

        /* =========================
           PAGES
        ========================= */

        .page {
            width: 100%;
            max-width: 400px;

            display: none;

            flex-direction: column;
            align-items: center;

            text-align: center;

            z-index: 2;
        }

        .page.active {
            display: flex;
        }

        /* =========================
           LOTTIE
        ========================= */

        .lottie-container {
            width: 130px;
            height: 130px;

            margin-bottom: 25px;

            z-index: 2;

            user-select: none;
            pointer-events: none;
        }

        /* =========================
           TEXT
        ========================= */

        .slide-up-text {
            opacity: 0;

            animation:
                slideUpIn
                0.5s
                cubic-bezier(0.1, 1, 0.1, 1)
                forwards;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;

            margin:
                0 0 15px 0;

            letter-spacing: 0.5px;
        }

        p {
            font-size: 16px;

            color: #b2bec3;

            line-height: 1.5;

            margin:
                0 0 35px 0;
        }

        /* =========================
           FORM
        ========================= */

        .form-container {
            width: 100%;

            background-color:
                var(--bg-secondary);

            border-radius: 16px;

            padding: 22px;

            border:
                1px solid
                rgba(0, 255, 65, 0.2);

            margin-bottom: 30px;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.5);
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;

            font-size: 12px;
            font-weight: 700;

            color:
                var(--matrix-neon);

            margin-bottom: 8px;

            text-transform: uppercase;

            letter-spacing: 1.5px;
        }

        input {
            width: 100%;

            padding: 14px;

            border:
                1px solid
                rgba(255, 255, 255, 0.08);

            border-radius: 10px;

            background-color:
                var(--bg-color);

            color:
                var(--text-color);

            font-size: 16px;

            transition:
                all 0.3s ease;
        }

        input:focus {
            outline: none;

            border-color:
                var(--matrix-neon);

            box-shadow:
                0 0 10px
                rgba(0, 255, 65, 0.25);
        }

        /* =========================
           BUTTON
        ========================= */

        .btn {
            width: 100%;

            background-color:
                var(--matrix-neon);

            color: #ffffff;

            border: none;

            border-radius: 12px;

            padding: 16px;

            font-size: 16px;
            font-weight: 700;

            cursor: pointer;

            transition:
                all 0.2s ease;

            box-shadow:
                0 4px 20px
                rgba(0, 255, 65, 0.4);

            letter-spacing: 0.5px;
        }

        .btn:active {
            transform: scale(0.97);

            background-color:
                #00d436;

            box-shadow:
                0 0 25px
                var(--matrix-neon);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* =========================
           ANIMATIONS
        ========================= */

        @keyframes matrixPulse {
            0%,
            100% {
                opacity: 0.25;
            }

            50% {
                opacity: 0.55;
            }
        }

        @keyframes slideUpIn {
            from {
                opacity: 0;
                transform:
                    translateY(12px);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0);
            }
        }
    </style>

        /* =================================
           GO TO FORM
        ================================== */

        function goToForm() {

            const welcomePage =
                document.getElementById(
                    "pageWelcome"
                );

            const formPage =
                document.getElementById(
                    "pageForm"
                );


            welcomePage.classList.remove(
                "active"
            );

            formPage.classList.add(
                "active"
            );


            /* Не создаём несколько
               экземпляров анимации */

            if (!formAnimation) {

                formAnimation =
                    lottie.loadAnimation({

                        container:
                            document.getElementById(
                                "lottieForm"
                            ),

                        renderer: "svg",

                        loop: true,

                        autoplay: true,

                        animationData:
                            airplaneEmojiData
                    });
            }


            /* Перезапуск анимации текста */

            const textElement =
                document.getElementById(
                    "formText"
                );

            textElement.style.animation =
                "none";

            void textElement.offsetHeight;

            textElement.style.animation =
                "slideUpIn 0.5s cubic-bezier(0.1, 1, 0.1, 1) forwards";
        }


        /* =================================
           SUBMIT
        ================================== */

        function submitData() {

            const name =
                document
                    .getElementById("botName")
                    .value
                    .trim();


            let username =
                document
                    .getElementById("botUsername")
                    .value
                    .trim();


            /* Проверка */

            if (!name || !username) {

                tg.showAlert(
                    "⚠️ Пожалуйста, заполните все поля!"
                );

                return;
            }


            /* Убираем @ */

            if (
                username.startsWith("@")
            ) {

                username =
                    username.substring(1);
            }


            /* Проверяем username */

            const usernameRegex =
                /^[a-zA-Z0-9_]{5,32}$/;


            if (
                !usernameRegex.test(username)
            ) {

                tg.showAlert(
                    "⚠️ Юзернейм должен содержать от 5 до 32 символов: латинские буквы, цифры и _"
                );

                return;
            }


            /* Кнопка */

            const submitBtn =
                document.getElementById(
                    "submitBtn"
                );


            submitBtn.disabled = true;

            submitBtn.innerText =
                "⏳ Отправка в матрицу...";


            /* Данные */

            const payload =
                JSON.stringify({

                    bot_name: name,

                    bot_username:
                        username

                });


            console.log(
                "Отправляем:",
                payload
            );


            /*
             * Передаём данные
             * Telegram Mini App → бот
             */

            tg.sendData(payload);
