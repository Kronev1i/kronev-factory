<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KRONEV Factory</title>
    <script src="https://telegram.org"></script>
    <style>
        :root {
            --bg-color: #17212b; /* Фирменный темно-серый фон Telegram */
            --bg-secondary: #242f3d; /* Дополнительный темный оттенок */
            --text-color: #f5f6f7;
            --neon-green: #39ff14; /* Салатовый неоновый */
            --neon-dimmed: rgba(57, 255, 20, 0.25); /* Приглушенный неон */
            --hint-color: #7f8c8d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
            position: relative;
        }

        /* Приглушенная неоновая ретро-сетка */
        .retro-grid {
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 300px;
            background-image: 
                linear-gradient(var(--neon-dimmed) 1px, transparent 1px),
                linear-gradient(90deg, var(--neon-dimmed) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: 1;
            /* Плавное затухание по краям (верх и низ) */
            mask-image: linear-gradient(to bottom, transparent, black 20%, black 80%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 20%, black 80%, transparent);
            /* Медленное циклическое мигание сетки */
            animation: gridPulse 6s ease-in-out infinite;
        }

        .page {
            width: 100%;
            max-width: 400px;
            display: none;
            flex-direction: column;
            align-items: center;
            text-align: center;
            z-index: 2;
        }

        .page.active {
            display: flex;
        }

        /* Анимированный эмодзи в очках */
        .emoji-container {
            font-size: 84px;
            margin-bottom: 20px;
            display: inline-block;
            z-index: 2;
            /* Цикл анимации эмодзи каждые 3 секунды */
            animation: emojiAnimate 3s ease-in-out infinite;
        }

        /* Всплывающий снизу на сантиметр текст */
        .slide-up-text {
            animation: slideUp 0.6s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            opacity: 0;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            margin: 0 0 15px 0;
            padding: 0 10px;
        }

        p {
            font-size: 16px;
            color: #b2bec3;
            line-height: 1.5;
            margin: 0 0 30px 0;
            padding: 0 15px;
        }

        /* Стили формы на 2-м экране */
        .form-container {
            width: 90%;
            background-color: var(--bg-secondary);
            border-radius: 16px;
            padding: 20px;
            box-sizing: border-box;
            border: 1px solid rgba(57, 255, 20, 0.15);
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--neon-green);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: 16px;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--neon-green);
            box-shadow: 0 0 8px rgba(57, 255, 20, 0.2);
        }

        /* Кнопки в стиле киберпанк/тг */
        .btn {
            width: 90%;
            background-color: var(--neon-green);
            color: #000000;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(57, 255, 20, 0.3);
        }

        .btn:active {
            transform: scale(0.97);
            box-shadow: 0 2px 5px rgba(57, 255, 20, 0.2);
        }

        /* --- Анимации --- */
        @keyframes gridPulse {
            0%, 100% { opacity: 0.25; }
            50% { opacity: 0.5; }
        }

        @keyframes emojiAnimate {
            0%, 100% { transform: scale(1) translateY(0); }
            40% { transform: scale(1.08) translateY(-8px); }
            50% { transform: scale(0.95) translateY(2px) rotate(3deg); }
            60% { transform: scale(1.02) translateY(-2px) rotate(-3deg); }
            70% { transform: scale(1) translateY(0); }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(12px); /* Смещение вниз ~ на 1 см */
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <!-- Задний фон: Неоновая ретро-сетка -->
    <div class="retro-grid"></div>

    <!-- ЭКРАН 1: ПРИВЕТСТВИЕ -->
    <div id="pageWelcome" class="page active">
        <div class="emoji-container">😎</div>
        <div class="slide-up-text">
            <h1>Создай своего KRONEV</h1>
            <p>Привет! Здесь ты можешь создать своего личного KRONEV для автоматизации бизнеса. Начнём?</p>
        </div>
        <button class="btn" onclick="goToForm()">🚀 Начать</button>
    </div>

    <!-- ЭКРАН 2: ВВОД ДАННЫХ -->
    <div id="pageForm" class="page">
        <div class="emoji-container">🤖</div>
        <div class="slide-up-text" id="formTextHeader">
            <h1>Параметры робота</h1>
            <p>Задайте базовые имя и юзернейм для автоматического развертывания.</p>
        </div>
        
        <div class="form-container">
            <div class="form-group">
                <label>🏷️ Название бота</label>
                <input type="text" id="botName" value="KRONEV Business Bot">
            </div>
            <div class="form-group">
                <label>🔗 Юзернейм бота (@)</label>
                <input type="text" id="botUsername" value="KronevTestBot">
            </div>
        </div>

        <button class="btn" id="submitBtn" onclick="submitData()">✨ Сгенерировать бота</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Переключение на экран ввода формы
        function goToForm() {
            document.getElementById('pageWelcome').classList.remove('active');
            const pageForm = document.getElementById('pageForm');
            pageForm.classList.add('active');
            
            // Сбрасываем и заново триггерим анимацию всплывания текста на новом экране
            const textHeader = document.getElementById('formTextHeader');
            textHeader.style.animation = 'none';
            textHeader.offsetHeight; /* триггер reflow */
            textHeader.style.animation = null;
        }

        // Прямая отправка данных серверу без багованных JS-окон
        function submitData() {
            const name = document.getElementById('botName').value.trim();
            let username = document.getElementById('botUsername').value.trim();

            if (!name || !username) {
                tg.showAlert("⚠️ Пожалуйста, заполните поля!");
                return;
            }

            if (username.startsWith('@')) {
                username = username.substring(1);
            }

            document.getElementById('submitBtn').disabled = true;
            document.getElementById('submitBtn').innerText = "⏳ Отправка данных...";

            // Упаковываем данные в JSON-строку
            const payload = JSON.stringify({
                bot_name: name,
                bot_username: username
            });

            // Напрямую шлем текстовую дату боту в чат. Окно закроется автоматически.
            tg.sendData(payload);
        }
    </script>
</body>
</html>
        });
    </script>
</body>
</html>
