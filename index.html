<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KRONEV Factory</title>
    <!-- Официальный SDK Telegram -->
    <script src="https://telegram.org"></script>
    <!-- Официальная библиотека Lottie для рендеринга фирменных TGS/JSON анимаций -->
    <script src="https://cloudflare.com"></script>
    <style>
        :root {
            --bg-color: #17212b; /* Родной темно-серый фон Telegram */
            --bg-secondary: #242f3d;
            --text-color: #f5f6f7;
            --matrix-neon: #00ff41; /* Матричный зеленый */
            --matrix-dimmed: rgba(0, 255, 65, 0.12);
            --matrix-dark-btn: #003b11; /* Глубокий темно-зеленый для кнопок */
            --matrix-border: #008f11;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
            position: relative;
            perspective: 800px; /* 3D Глубина сцены */
        }

        /* 3D Ретро-сетка в стиле Матрицы */
        .retro-grid {
            position: absolute;
            top: 15%;
            left: 50%;
            width: 600px;
            height: 600px;
            transform: translateX(-50%) rotateX(65deg); /* Наклон камеры сверху вниз */
            background-image: 
                linear-gradient(var(--matrix-dimmed) 1.5px, transparent 1.5px),
                linear-gradient(90deg, var(--matrix-dimmed) 1.5px, transparent 1.5px);
            background-size: 40px 40px;
            z-index: 1;
            mask-image: linear-gradient(to bottom, transparent, black 15%, black 75%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 15%, black 75%, transparent);
            animation: matrixPulse 6s ease-in-out infinite;
        }

        .page {
            width: 100%;
            max-width: 400px;
            display: none;
            flex-direction: column;
            align-items: center;
            text-align: center;
            z-index: 2;
        }

        .page.active {
            display: flex;
        }

        /* Контейнер для загрузки векторных Lottie-эмодзи */
        .lottie-emoji {
            width: 120px;
            height: 120px;
            margin-bottom: 20px;
            z-index: 2;
            filter: drop-shadow(0 0 15px rgba(0, 255, 65, 0.3));
        }

        /* Анимация всплытия текста ровно на 1 сантиметр (12px) */
        .slide-up-text {
            opacity: 0;
            animation: slideUpIn 0.5s cubic-bezier(0.1, 1, 0.1, 1) forwards;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin: 0 0 15px 0;
            letter-spacing: 0.5px;
        }

        p {
            font-size: 16px;
            color: #b2bec3;
            line-height: 1.5;
            margin: 0 0 35px 0;
        }

        .form-container {
            width: 100%;
            background-color: var(--bg-secondary);
            border-radius: 16px;
            padding: 22px;
            box-sizing: border-box;
            border: 1px solid rgba(0, 255, 65, 0.2);
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: var(--matrix-neon);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: 16px;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--matrix-neon);
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.25);
        }

        /* Кнопки "Матрица" — темный неон с яркой окантовкой */
        .btn {
            width: 100%;
            background-color: var(--matrix-dark-btn);
            color: var(--matrix-neon);
            border: 2px solid var(--matrix-border);
            border-radius: 12px;
            padding: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 20px rgba(0, 255, 65, 0.15);
            letter-spacing: 0.5px;
        }

        .btn:active {
            transform: scale(0.97);
            background-color: var(--matrix-border);
            color: #000000;
            box-shadow: 0 0 15px var(--matrix-neon);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* --- Тайминги и Ключевые Кадры --- */
        @keyframes matrixPulse {
            0%, 100% { opacity: 0.25; }
            50% { opacity: 0.55; }
        }

        @keyframes slideUpIn {
            from {
                opacity: 0;
                transform: translateY(12px); /* Смещение вниз ~ 1 см */
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <!-- Ретро-сетка матрицы под наклоном камеры -->
    <div class="retro-grid"></div>

    <!-- ЭКРАН 1: ПРИВЕТСТВИЕ -->
    <div id="pageWelcome" class="page active">
        <!-- Контейнер для оригинального ТГ-смайлика 😎 -->
        <div id="lottieWelcome" class="lottie-emoji"></div>
        <div class="slide-up-text" id="welcomeText">
            <h1>Создай своего KRONEV</h1>
            <p>Привет! Здесь ты можешь создать своего личного KRONEV для автоматизации бизнеса. Начнём?</p>
        </div>
        <button class="btn" onclick="goToForm()">🚀 Начать</button>
    </div>

    <!-- ЭКРАН 2: ВВОД ДАННЫХ -->
    <div id="pageForm" class="page">
        <!-- Контейнер для оригинального ТГ-самолетика ✈️ -->
        <div id="lottieForm" class="lottie-emoji"></div>
        <div class="slide-up-text" id="formText">
            <h1>Параметры робота</h1>
            <p>Задайте базовые имя и юзернейм для автоматического развертывания.</p>
        </div>
        
        <div class="form-container">
            <div class="form-group">
                <label>🏷️ Название бота</label>
                <input type="text" id="botName" value="KRONEV Business Bot">
            </div>
            <div class="form-group">
                <label>🔗 Юзернейм бота (@)</label>
                <input type="text" id="botUsername" value="KronevTestBot">
            </div>
        </div>

        <button class="btn" id="submitBtn" onclick="submitData()">✨ Сгенерировать бота</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Переменные для хранения инстансов Lottie
        let welcomeAnimation = null;
        let formAnimation = null;

        // Инициализируем смайлик в очках на 1-м экране (чистый Telegram JSON)
        welcomeAnimation = lottie.loadAnimation({
            container: document.getElementById('lottieWelcome'),
            renderer: 'svg',
            loop: true,
            autoplay: true,
            path: 'https://lottiefiles.com' // Оригинальный ТГ-стиль 😎
        });

        function goToForm() {
            // Переключаем экраны
            document.getElementById('pageWelcome').classList.remove('active');
            const pageForm = document.getElementById('pageForm');
            pageForm.classList.add('active');
            
            // Если анимация самолетика еще не запущена — инициализируем (чистый Telegram JSON)
            if (!formAnimation) {
                formAnimation = lottie.loadAnimation({
                    container: document.getElementById('lottieForm'),
                    renderer: 'svg',
                    loop: true,
                    autoplay: true,
                    path: 'https://lottiefiles.com' // Фирменный самолетик ✈️
                });
            }

            // Сбрасываем и триггерим анимацию всплывания текста на новом экране (на 1 см)
            const textElement = document.getElementById('formText');
            textElement.style.animation = 'none';
            textElement.offsetHeight; /* триггер reflow */
            textElement.style.animation = null;
        }

        function submitData() {
            const name = document.getElementById('botName').value.trim();
            let username = document.getElementById('botUsername').value.trim();

            if (!name || !username) {
                tg.showAlert("⚠️ Пожалуйста, заполните все поля!");
                return;
            }

            if (username.startsWith('@')) {
                username = username.substring(1);
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = "⏳ Отправка в матрицу...";

            const payload = JSON.stringify({
                bot_name: name,
                bot_username: username
            });

            Используйте код с осторожностью.
            // Напрямую шлем JSON строку бэкенду
            tg.sendData(payload);
            }

            });
            // Безопасно передаем данные на Python бэкенд
            tg.sendData(payload);
            }
